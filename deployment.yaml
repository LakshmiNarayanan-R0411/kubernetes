apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-control-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-control-system
  template:
    metadata:
      labels:
        app: inventory-control-system
    spec:
      containers:
        - name: inventory-control-system
          image: lakshminarayananr0411/inventory-control-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-control-system-service
spec:
  type: NodePort
  selector:
    app: inventory-control-system
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007

